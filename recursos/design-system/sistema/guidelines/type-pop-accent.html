<!-- @dsCard group="Type" viewport="700x180" name="Accent — DM Serif Display" subtitle="Italic signature word inside a Bebas headline" -->
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:#0D0D0D;color:#FAFAFA;padding:24px;box-sizing:border-box;font-family:var(--font-display-pop);}
  .h{font-size:52px;line-height:.95;text-transform:uppercase;}
  .h em{font-family:var(--font-serif);font-style:italic;text-transform:none;color:#F5D732;font-size:0.85em;}
  .note{font-family:var(--font-sans-pop);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:rgba(250,250,250,.4);margin-top:14px;}
</style>
</head>
<body>
  <div class="h">O que acontece em <em>Austin</em> você sabe primeiro</div>
  <div class="note">DM Serif Display italic — one accent word per headline</div>
</body>
</html>
