<!-- @dsCard group="Spacing" viewport="700x220" name="Spacing Scale" subtitle="--space-1 (4px) through --space-10 (128px)" -->
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:#0D0D0D;padding:20px;box-sizing:border-box;font-family:var(--font-sans-pop);color:#FAFAFA;}
  .row{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:10px;}
  .bar{background:var(--pop-amarelo);height:8px;}
  .tag{width:130px;opacity:.6;flex-shrink:0;}
</style>
</head>
<body>
  <div class="row"><div class="tag">--space-1 · 4px</div><div class="bar" style="width:4px"></div></div>
  <div class="row"><div class="tag">--space-3 · 12px</div><div class="bar" style="width:12px"></div></div>
  <div class="row"><div class="tag">--space-5 · 24px</div><div class="bar" style="width:24px"></div></div>
  <div class="row"><div class="tag">--space-6 · 32px</div><div class="bar" style="width:32px"></div></div>
  <div class="row"><div class="tag">--space-7 · 48px</div><div class="bar" style="width:48px"></div></div>
  <div class="row"><div class="tag">--space-8 · 64px</div><div class="bar" style="width:64px"></div></div>
  <div class="row"><div class="tag">--space-9 · 96px</div><div class="bar" style="width:96px"></div></div>
  <div class="row"><div class="tag">--space-10 · 128px</div><div class="bar" style="width:128px"></div></div>
</body>
</html>
