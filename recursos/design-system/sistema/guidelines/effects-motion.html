<!-- @dsCard group="Spacing" viewport="700x170" name="Motion — Easing &amp; Duration" subtitle="Two motions only: ticker marquee + spinning ★. No bounce, no overshoot" -->
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:#0D0D0D;padding:20px;box-sizing:border-box;font-family:var(--font-sans-pop);color:#FAFAFA;font-size:11px;}
  .row{display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.08);padding:8px 0;}
  .tag{opacity:.6;}
</style>
</head>
<body>
  <div class="row"><span class="tag">--ease-out</span><span>cubic-bezier(0.16,1,0.3,1) · hover / reveals</span></div>
  <div class="row"><span class="tag">--ease-smooth</span><span>cubic-bezier(0.25,0.46,0.45,0.94) · micro-moves</span></div>
  <div class="row"><span class="tag">ticker</span><span>22s linear infinite marquee</span></div>
  <div class="row"><span class="tag">durations</span><span>0.15s fast · 0.3s base · 0.6s slow</span></div>
</body>
</html>
