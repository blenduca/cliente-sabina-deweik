<!-- @dsCard group="Colors" viewport="700x180" name="Semantic Tokens" subtitle="surface / text / accent / border — how components consume color" -->
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-bg);font-family:var(--font-sans-pop);color:var(--text-primary);padding:20px;box-sizing:border-box;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;font-size:11px;}
  .t{background:var(--surface-card);border:1px solid var(--border-default);padding:12px;border-radius:4px;}
  .sw{width:100%;height:28px;border-radius:3px;margin-bottom:6px;}
</style>
</head>
<body>
  <div class="t"><div class="sw" style="background:var(--surface-card)"></div>--surface-card</div>
  <div class="t"><div class="sw" style="background:var(--text-primary)"></div>--text-primary</div>
  <div class="t"><div class="sw" style="background:var(--accent)"></div>--accent</div>
  <div class="t"><div class="sw" style="background:transparent;border:1px solid var(--border-strong)"></div>--border-strong</div>
</body>
</html>
