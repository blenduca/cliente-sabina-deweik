<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0;height:100%;}
  .tile{display:flex;width:1280px;height:854px;}
  .main{flex:0 0 75%;background:#0D0D0D;display:flex;align-items:center;justify-content:center;padding:0 60px;box-sizing:border-box;}
  .mark{font-family:var(--font-display-pop);color:#F5D732;text-transform:uppercase;font-size:150px;line-height:0.9;letter-spacing:0.01em;text-align:center;}
  .strip{flex:1;display:flex;flex-direction:column;}
  .strip div{flex:1;}
</style>
</head>
<body>
<div class="tile">
  <div class="main"><div class="mark">Sabina<br>Deweik</div></div>
  <div class="strip">
    <div style="background:#F5D732"></div>
    <div style="background:#5BC9D9"></div>
    <div style="background:#00A651"></div>
    <div style="background:#E8683A"></div>
  </div>
</div>
</body>
</html>
